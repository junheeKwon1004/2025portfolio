                    <script>
                    function copySection(id = "targetSection") {
                        const el = document.getElementById(id);
                        if (!el) return alert("복사할 영역을 찾지 못했습니다.");
                        const data = el.innerHTML;
                        if (navigator.clipboard?.writeText) {
                            navigator.clipboard.writeText(data)
                                .then(() => alert("소스 복사 완료!\nCtrl+V로 붙여넣기 하세요."))
                                .catch(() => fallbackCopy(data));
                        } else {
                            fallbackCopy(data);
                        }
                    }
                    function fallbackCopy(text) {
                        const ta = document.createElement("textarea");
                        ta.value = text; ta.style.position = "fixed"; ta.style.top = "-9999px";
                        document.body.appendChild(ta); ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                        alert("소스 복사 완료!\nCtrl+V로 붙여넣기 하세요.");
                    }
                    </script>
                    <button class="copyBtn" onclick="copySection()">소스 복사하기</button>

            dataType: "json",
            type: "POST",
            data: { evntId: evntId, bnfSeq: bnfSeq },
            success: function (data, textStatus, jqXHR) {
                if (!crew.ajaxValidate(data)) { return; }
                $.ajax({
                    async: false,
                    url: ctx_curr + "/op/evnt/evntJoin.json",
                    dataType: "json",
                    type: "POST",
                    data: { evntId: evntId, bnfSeq: bnfSeq },
                    success: function (data, textStatus, jqXHR) {

                        if (!crew.ajaxValidate(data)) { return; }

                        // 이벤트 참여 결과 내용 구성
                        var winInfo = [];
                        var winType = "";
                        var svmtAmt = "";
                        var cupNm = "";
                        var cupDcAmt = "";
                        var cupDcRate = "";
                        var curCd = "";
                        var famtYn = "";
                        var evntGvawNm = "";    // 2025.09.08 IT - 당첨된 경품명

                        // 상세항목 구성
                        var bnfListWinResult = data.info.bnfListWinResult;
                        for (var i = 0; bnf = bnfListWinResult[i]; i++) {
                            if (bnf.svmtId != null) {
                                winInfo.push("적립금 " + comma(bnf.rsvgAmt) + "원");
                                winType = "svmt";
                                svmtAmt = comma(bnf.rsvgAmt);
                            }

                            if (bnf.cupId != null) {
                                winInfo.push("쿠폰 " + bnf.cupNm);
                                winType = "cup";
                                cupNm = bnf.cupNm;
                                cupDcAmt = comma(bnf.cupDcAmt);
                                cupDcRate = bnf.cupDcRate;
                                curCd = bnf.curCd;
                                famtYn = bnf.famtYn;
                            }

                            if (bnf.evntGvawCommNm != null) {
                                evntGvawNm = bnf.evntGvawCommNm;    //// 2025.09.08 IT 당첨된 경품명 evntGvawNm변수에 저장
                                winInfo.push(evntGvawNm);
                                winType = "gvaw";

                                _joinYN = "Y";
                            }
                        }

                        if (winInfo.length != 0) {
                            $("#event_result_msg").html("축하합니다!<br>" + winInfo.join(",") + "에 당첨되었습니다.");

                        } else {
                            $("#event_result_msg").html("꽝!<br>아쉽지만 다음 기회를 노려주세요.");
                        }

                        var msgBox = [];
                        if (winType == "svmt") {  //적립금
                            msgBox.push('<div class="save_coupon_box sm ">');
                            msgBox.push('    <p class="tit">적립금</p>');
                            msgBox.push('    <p class="resize win"><span>￦</span>' + svmtAmt + '</p>');
                            msgBox.push('</div>');
                            $("#evnt_info_msg").html("다운로드 받은 혜택은 마이현대에서 확인하세요.");

                        } else if (winType == "cup") { //쿠폰
                            msgBox.push('<div class="save_coupon_box cp">');
                            msgBox.push('    <p class="tit">' + cupNm + '</p>');
                            if (famtYn == "Y") {
                                if (curCd == "USD") {
                                    msgBox.push('    <p class="sale">$<span>' + cupDcAmt + '</span></p>');
                                } else {
                                    msgBox.push('    <p class="sale"><span>' + cupDcAmt + '</span>원</p>');
                                }
                            } else if (famtYn == "N") {
                                msgBox.push('    <p class="sale"><span>' + cupDcRate + '</span>%</p>');
                            }
                            msgBox.push('</div>');
                            $("#evnt_info_msg").html("다운로드 받은 혜택은 마이현대에서 확인하세요.");

                        } else if (winType == "gvaw") { //상품
                            // 2025.09.08 IT 당첨된 경품명을 비교하여 경품별 팝업띄우기
                            switch (evntGvawNm) {
                                case _set_prize01:
                                    $("#prize01").stop().fadeIn();
                                    _joinPrize01YN = "Y";
                                    break;
                                case _set_prize02:
                                    $("#prize02").stop().fadeIn();
                                    _joinPrize02YN = "Y";
                                    break;
                                case _set_prize03:
                                    $("#prize03").stop().fadeIn();
                                    _joinPrize03YN = "Y";
                                    break;
                                case _set_prize04:
                                    $("#prize04").stop().fadeIn();
                                    _joinPrize04YN = "Y";
                                    break;

                                default:
                                    $("#prize05").stop().fadeIn();

                                    esimCode = evntGvawNm;
                                    if (esimCode !== "") {
                                        $("#esimCouponPop .pop_text__box").text(esimCode);

                                        console.log("당첨된 eSIM 쿠폰 번호:", esimCode);
                                    } else {
                                        alert("쿠폰 번호가 조회되지 않았습니다.");
                                    }
                                    _joinPrize05YN = "Y";

                                    break;
                            }

                        } else {  //꽝
                        }
                    },
                    error: function (jqXHR, textStatus, errorThrown) {
                        //console.log(jqXHR.status);
                    }
                });
            },
            error: function (jqXHR, textStatus, errorThrown) {
                //console.log(jqXHR.status);
            }
        });
    }

    $(".check_coupon").on("click", function () {
        $("#esimCouponPop").stop().fadeIn();
        $("#prize05").stop().fadeOut();
    })

    /* S : 내가 받은 혜택 확인하기 */
    function _checkMyStats() {
        console.log("당첨 체크 버튼");
        if (!isLogin) { alert("로그인 후 이용해주세요."); login(); return; }
        
        if (_joinYN == "N") {
            alert("이벤트 참여 내역이 없습니다.");
        }
        else if (_joinYN == "Y") {
            const prizeMap = {
                _joinPrize01YN: "#prize01",
                _joinPrize02YN: "#prize02",
                _joinPrize03YN: "#prize03",
                _joinPrize04YN: "#prize04"
            };

            for (let key in prizeMap) {
                if (window[key] === "Y") {
                    // [수정] 팝업 띄울 때 배경 딤드(is-on)도 같이 추가
                    $('#evtDim').addClass('is-on');
                    $(prizeMap[key]).stop().fadeIn();
                    break;
                }
            }
        }
    }
    /* E : 내가 받은 혜택 확인하기 */
</script>
